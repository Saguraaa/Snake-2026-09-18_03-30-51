<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贪吃蛇 · 像素资产</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#edf3f7;background:#171d25;letter-spacing:0}
    *{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1160px;margin:auto;padding:24px}
    header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid #35404b}h1{font-size:24px;margin:0}header span,footer{font-size:12px;color:#a1b4c1}
    h2{font-size:16px;margin:0 0 18px}section{padding:24px 0;border-bottom:1px solid #35404b}.top{display:grid;grid-template-columns:minmax(0,640px) minmax(260px,1fr);gap:32px}
    img{image-rendering:pixelated}#map{width:100%;height:auto;aspect-ratio:10/7}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{margin:0;min-width:0}.tile img{display:block;width:64px;height:64px;max-width:100%;object-fit:contain;background:#252f39}.tile figcaption{font-size:11px;color:#a1b4c1;margin:5px 0 8px;line-height:1.5;overflow-wrap:anywhere}
    .animation{display:grid;grid-template-columns:220px 1fr;gap:32px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}label{font-size:13px;color:#a1b4c1}select,button{font:inherit;color:inherit;background:#25333d;border:1px solid #425464;border-radius:4px;min-height:36px;padding:6px 10px;max-width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #6cd9f1;outline-offset:3px}button:hover{background:#344652}
    #motion{width:192px;height:192px;background:#25313b;display:block}#counter{font-size:12px;min-width:45px;color:#a1b4c1}#frames{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-content:start}#frames button{padding:4px;min-width:0}#frames button[aria-pressed="true"]{border-color:#6cd9f1;background:#364b57}#frames img{width:100%;height:auto;aspect-ratio:1;display:block}#frames small{display:block;text-align:center;color:#a1b4c1;font-size:11px}.stills{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}.stills img{width:96px;height:96px;max-width:100%;object-fit:contain}
    .speed{display:flex;align-items:center;gap:8px;font-size:12px}input{accent-color:#6cd9f1;max-width:110px}footer{padding-top:16px}
    @media(max-width:760px){header{align-items:flex-start;flex-direction:column}header,main,footer{padding:18px}.top{grid-template-columns:1fr;gap:18px}.tiles{grid-template-columns:repeat(4,1fr)}.animation{grid-template-columns:1fr;gap:20px}#motion{margin:auto}.stills{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}#frames{gap:5px}#frames button{padding:2px}h1{font-size:22px}}
  </style>
</head>
<body>
  <header><h1>贪吃蛇 · 像素资产</h1><span>草地 16 × 16 · 角色 32 × 32 · SVG / PNG</span></header>
  <main>
    <section class="top"><div><h2>地图拼接</h2><img id="map" width="640" height="448" alt="草地上的蓝色贪吃蛇和果子"></div><div><h2>草地 · 16 张</h2><div class="tiles" id="tiles"></div></div></section>
    <section><h2>转向与待机</h2><div class="controls"><label for="sequence">动作</label><select id="sequence"></select><button id="play" type="button" title="暂停" aria-label="暂停">Ⅱ</button><button id="restart" type="button" title="重新播放" aria-label="重新播放">↻</button><span id="counter">1 / 6</span><label class="speed">速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="0.5"><output id="speed-value">0.5×</output></label></div><div class="animation"><img id="motion" width="192" height="192" alt="动作预览"><div id="frames"></div></div></section>
    <section><h2>蛇头 · 蛇身 · 蛇尾 · 果子</h2><div class="stills" id="stills"></div></section>
  </main>
  <footer>Pixel Adventure 1 风格参考 · 原创像素绘制</footer>
  <script src="preview-data.js"></script>
  <script>
    const data = window.SNAKE_ART;
    const names = {top_left:'左上',top:'上',top_right:'右上',left:'左',center:'中',right:'右',bottom_left:'左下',bottom:'下',bottom_right:'右下',inner_tl:'凹角 · 左上',inner_tr:'凹角 · 右上',inner_bl:'凹角 · 左下',inner_br:'凹角 · 右下',center_2:'中心 · 2',center_3:'中心 · 3',center_4:'中心 · 4'};
    const dirs = {up:'上',right:'右',down:'下',left:'左'};
    const parts = {head:'蛇头',tail:'蛇尾'};
    function label(id){if(id==='fruit_apple')return '得分果子';if(id==='body_horizontal')return '身体 · 横向';if(id==='body_vertical')return '身体 · 纵向';if(id.startsWith('body_corner_'))return '弯角 · '+id.slice(12).split('_').map(d=>dirs[d]).join(' / ');const [part,direction]=id.split('_');return parts[part]+' · '+dirs[direction]}
    function tile(item, caption){const f=document.createElement('figure');f.className='tile';const img=new Image();img.src=item.src;img.alt=caption;const c=document.createElement('figcaption');c.textContent=caption;f.append(img,c);return f}
    document.getElementById('map').src=data.map;
    data.grass.forEach(a=>document.getElementById('tiles').append(tile(a,names[a.id.slice(6)])));
    data.stills.forEach(a=>document.getElementById('stills').append(tile(a,label(a.id))));
    const select=document.getElementById('sequence'),motion=document.getElementById('motion'),frames=document.getElementById('frames'),play=document.getElementById('play'),speed=document.getElementById('speed');
    let current,frame=0,playing=true,elapsed=0,last=performance.now();
    for(const seq of data.sequences){const o=document.createElement('option');o.value=seq.id;const m=seq.id.match(/^(head|tail)_turn_(\w+)_to_(\w+)$/);o.textContent=m?`${parts[m[1]]} · ${dirs[m[2]]} → ${dirs[m[3]]}`:`蛇头待机 · ${dirs[seq.id.split('_').at(-1)]}`;select.append(o)}
    function show(){motion.src=current.frames[frame];document.getElementById('counter').textContent=`${frame+1} / ${current.frames.length}`;[...frames.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===frame)))}
    function setPlaying(value){playing=value;play.textContent=value?'Ⅱ':'▶';play.title=value?'暂停':'播放';play.setAttribute('aria-label',play.title)}
    function load(){current=data.sequences.find(a=>a.id===select.value);frame=0;elapsed=0;frames.replaceChildren();current.frames.forEach((src,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`第 ${i+1} 帧`);const img=new Image();img.src=src;img.alt='';const c=document.createElement('small');c.textContent=String(i+1);b.append(img,c);b.onclick=()=>{setPlaying(false);frame=i;elapsed=0;show()};frames.append(b)});show()}
    select.value='head_turn_up_to_right';load();select.onchange=load;
    play.onclick=()=>setPlaying(!playing);document.getElementById('restart').onclick=()=>{frame=0;elapsed=0;setPlaying(true);show()};
    speed.oninput=()=>document.getElementById('speed-value').value=`${speed.value}×`;
    function tick(now){const dt=Math.min(now-last,100);last=now;if(playing){elapsed+=dt*Number(speed.value);const hold=current.durations[frame]+(frame===current.frames.length-1?550:0);if(elapsed>=hold){elapsed-=hold;frame=(frame+1)%current.frames.length;show()}}requestAnimationFrame(tick)}
    requestAnimationFrame(tick);
  </script>
</body>
</html>
